name: "Continuous Integration"

on:
  pull_request:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
    tags:

env:
  default_php: 8.2

jobs:
  ci:
    uses: laminas/workflow-continuous-integration/.github/workflows/continuous-integration.yml@1.x
  coverage:
    name: PHPUnit Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: shivammathur/setup-php@2.35.4
        with:
          php-version: ${{ env.default_php }}
          extensions: pcov
          coverage: pcov
          ini-values: pcov.enabled=1
      - uses: "ramsey/composer-install@3.1.1"
      - run: php ./vendor/bin/phpunit --coverage-clover=coverage.xml
        env:
          PRISMIC_REPO: ${{ secrets.PRISMIC_REPO }}
          PRISMIC_TOKEN: ${{ secrets.PRISMIC_TOKEN }}

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  composer-require-checker:
    name: "Check for missing dependencies"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v5.0.0
      - uses: shivammathur/setup-php@2.35.4
        with:
          php-version: ${{ env.default_php }}
      - uses: "ramsey/composer-install@3.1.1"
        with:
          dependency-versions: "highest"
      - run: composer global config bin-dir /usr/local/bin
      - run: composer global require -W maglnet/composer-require-checker
      - run: /usr/local/bin/composer-require-checker check

  psalm-security-report:
    name: "Psalm Security Report"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: shivammathur/setup-php@2.35.4
        with:
          php-version: ${{ env.default_php }}
      - uses: "ramsey/composer-install@3.1.1"
      - name: "Psalm"
        run: vendor/bin/psalm --report=results.sarif
      - name: "Upload Security Analysis results to GitHub"
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
